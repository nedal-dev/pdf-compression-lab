name: Reproduce PDF experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reproduce.yml'
      - 'experiment.py'
      - 'build_report.py'
      - 'canonical.txt'
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore original sources on first run
        shell: python
        env:
          PROJECT_SOURCE: ""
        run: |
          import os, json, base64
          from pathlib import Path
          for name, data in json.loads(base64.b64decode(os.environ['PROJECT_SOURCE'])).items():
              path = Path(name)
              if not path.exists():
                  path.write_bytes(base64.b64decode(data))
      - name: Install free reproducibility dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -r requirements.txt
      - name: Run actual experiment and build static report
        run: |
          python experiment.py
          python build_report.py
      - name: Save evidence and report in this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiment.py build_report.py requirements.txt robots.txt README.md LICENSE .gitignore .gitattributes index.html data assets
          git diff --cached --quiet && exit 0
          git commit -m 'Record executed PDF experiment and generated report'
          git push
